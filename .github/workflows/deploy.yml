name: CI/CD Pipeline - Docs-Wiki Homelab

on:
  push:
    branches: [ staging ]

permissions:
  contents: write

jobs:
  build-test-deploy:
    name: 🏗️ CI/CD Pipeline (Build, Test, Deploy & Tag)
    environment: staging
    runs-on: self-hosted
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Gerar arquivo .env
        env:
          ENV_STAGING: ${{ secrets.ENV_STAGING }}
        run: |
          if [ -n "$ENV_STAGING" ]; then
            echo "$ENV_STAGING" > .env
            echo "✅ Arquivo .env gerado a partir do Secret ENV_STAGING."
          elif [ -f .env.example ]; then
            cp .env.example .env
            echo "ℹ️ Arquivo .env inicializado a partir de .env.example."
          fi

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências do Monorepo
        run: npm ci --loglevel=error --no-audit

      - name: Compilar TypeScript em Todos os Pacotes
        run: npm run build

      - name: Validar Sintaxe do Docker Compose
        run: docker compose config

      - name: Executar Testes no Backend (Jest + Supertest)
        run: npm run test:backend

      - name: Executar Testes no Frontend (Jest + RTL)
        run: npm run test:frontend

      - name: 🔒 Garantir Certificados SSL
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: |
          mkdir -p certs
          if [ ! -f certs/fullchain.pem ] || [ ! -f certs/privkey.pem ]; then
            openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
              -keyout certs/privkey.pem \
              -out certs/fullchain.pem \
              -subj "/CN=docswiki.local"
            chmod 644 certs/*.pem
            echo "✅ Certificados SSL autoassinados gerados com sucesso."
          fi

      - name: Subir Containers Atualizados (Build Paralelo)
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: |
          docker compose build --parallel
          docker compose up -d --remove-orphans

      - name: Limpeza de Imagens Órfãs
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: docker image prune -f

      - name: Calcular e Publicar Tag LTS
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        id: create_tag
        run: |
          DATE=$(date +'%Y%m%d')
          TAG_NAME="v1.0.${{ github.run_number }}-lts-${DATE}"
          
          git config user.name "Vinicius Chaves"
          git config user.email "viniciuschaves.empresarial@gmail.com"
          
          git tag -a "$TAG_NAME" -m "Release LTS automática gerada no build #${{ github.run_number }}"
          git push origin "$TAG_NAME"
          
          echo "new_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Tag LTS $TAG_NAME criada com sucesso!"