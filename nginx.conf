events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Otimizações de Desempenho
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Resolver DNS interno do Docker — resolve upstreams dinamicamente
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Redirecionamento HTTP (Porta 80) -> HTTPS (Porta 443)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS (Porta 443)
    server {
        listen 443 ssl http2;
        server_name _;

        # Certificados SSL/TLS
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Cabeçalhos de Segurança OWASP
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend (SPA React)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # IAM & Autenticação (/api/iam e /api/v1/auth)
        location /api/iam {
            limit_req zone=auth_limit burst=10 nodelay;
            set $upstream_iam http://iam-service:3001;
            rewrite ^/api/iam/?(.*) /$1 break;
            proxy_pass $upstream_iam;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/auth {
            limit_req zone=auth_limit burst=10 nodelay;
            set $upstream_iam http://iam-service:3001;
            rewrite ^/api/v1/auth/?(.*) /$1 break;
            proxy_pass $upstream_iam;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Gestão de Conteúdo e Git-Like (/api/content e /api/v1/content)
        location /api/content {
            limit_req zone=api_limit burst=30 nodelay;
            set $upstream_content http://content-service:3002;
            rewrite ^/api/content/?(.*) /$1 break;
            proxy_pass $upstream_content;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/content {
            limit_req zone=api_limit burst=30 nodelay;
            set $upstream_content http://content-service:3002;
            rewrite ^/api/v1/content/?(.*) /$1 break;
            proxy_pass $upstream_content;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Busca Híbrida & RAG Chat (Gemini) (/api/search, /api/v1/search, /search, /chat)
        location /api/search {
            limit_req zone=api_limit burst=30 nodelay;
            set $upstream_search http://search-service:3004;
            rewrite ^/api/search/?(.*) /$1 break;
            proxy_pass $upstream_search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/search {
            limit_req zone=api_limit burst=30 nodelay;
            set $upstream_search http://search-service:3004;
            rewrite ^/api/v1/search/?(.*) /$1 break;
            proxy_pass $upstream_search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /search {
            limit_req zone=api_limit burst=30 nodelay;
            set $upstream_search http://search-service:3004;
            proxy_pass $upstream_search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /chat {
            limit_req zone=api_limit burst=30 nodelay;
            set $upstream_search http://search-service:3004;
            proxy_pass $upstream_search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Documentação OpenAPI / Swagger Agregada
        location /api-docs {
            proxy_pass http://search-service:3004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
