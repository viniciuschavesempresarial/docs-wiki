# =============================================================================
# TELEGRAF CONFIGURATION - AMBIENTE DE STAGING / TESTES DE CARGA
# =============================================================================
# Coletor de métricas leve local (Target Node) enviando para VictoriaMetrics

[global_tags]
  project = "${MONITORING_PROJECT}"
  environment = "${MONITORING_ENVIRONMENT}"
  node_role = "${MONITORING_NODE_ROLE}"
  host = "${MONITORING_HOST}"

[agent]
  interval = "2s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "2s"
  flush_jitter = "0s"
  precision = "1ms"
  debug = false
  quiet = false
  logfile = ""
  hostname = "${MONITORING_HOST}"
  omit_hostname = false

# =============================================================================
# OUTPUT: VICTORIAMETRICS (Remote Write via InfluxDB Line Protocol)
# =============================================================================
[[outputs.influxdb]]
  urls = ["http://${VICTORIAMETRICS_HOST}:${VICTORIAMETRICS_PORT}"]
  database = "telegraf"
  skip_database_creation = true
  timeout = "5s"

# =============================================================================
# INPUTS: SISTEMA OPERACIONAL & HARDWARE LOCAL
# =============================================================================
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.system]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.net]]
  interfaces = ["eth0", "en*", "wl*", "docker0", "br-*"]
  ignore_protocol_stats = true

# =============================================================================
# INPUTS: CONTAINERS DOCKER
# =============================================================================
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  timeout = "5s"
  interval = "10s"
  perdevice = false
  total_include = ["cpu", "blkio", "network"]

# =============================================================================
# INPUTS: REDIS (CACHE & EMBEDDINGS)
# =============================================================================
[[inputs.redis]]
  servers = ["tcp://:${REDIS_PASSWORD}@redis:6379"]
  [inputs.redis.tags]
    service = "redis"

# =============================================================================
# INPUTS: RABBITMQ (MENSAGERIA & FILAS DE NLP)
# =============================================================================
[[inputs.rabbitmq]]
  url = "http://rabbitmq:15672"
  username = "${RABBITMQ_DEFAULT_USER}"
  password = "${RABBITMQ_DEFAULT_PASS}"
  metric_exclude = ["federation"]
  [inputs.rabbitmq.tags]
    service = "rabbitmq"
