server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://${LOKI_HOST}:${LOKI_PORT}/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          project: ${MONITORING_PROJECT}
          environment: ${MONITORING_ENVIRONMENT}
          node_role: ${MONITORING_NODE_ROLE}
          host: ${MONITORING_HOST}
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            tag: attrs.tag
      - labels:
          stream:
      - regex:
          expression: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/.*json\.log$'
          source: filename
      - labels:
          container_id:
      - regex:
          expression: "(?P<container_name>.+)"
          source: tag
      - labels:
          container_name:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: log
